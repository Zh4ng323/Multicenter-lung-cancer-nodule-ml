# Nginx reverse proxy config for Lung Cancer AI Warning System
# 部署到服务器后放到 /etc/nginx/sites-available/lungcancerai
# 然后：ln -s /etc/nginx/sites-available/lungcancerai /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# 证书两种方式任选：
#   方式 A（推荐，自动续期）：用 certbot 申请，见部署指南。
#   方式 B（手动）：把证书放到下面两个路径并取消注释 ssl_certificate 两行。

# HTTP -> HTTPS 重定向；同时保留 ACME 验证路径供 certbot 自动续期
server {
    listen 80;
    server_name your-domain.com;

    # certbot --webroot 验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # 方式 B：手动放置证书时填写真实路径
    # ssl_certificate     /etc/ssl/certs/your-cert.pem;
    # ssl_certificate_key /etc/ssl/private/your-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # certbot --webroot 验证目录（续期时也走这里）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 允许 CSV 上传最大 50MB
    client_max_body_size 50M;

    # ---- PWA：Service Worker 和 manifest 禁止缓存，保证更新及时 ----
    location = /sw.js {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed /;
        expires off;
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ---- 主应用（Gradio）+ WebSocket ----
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gradio 预测依赖 WebSocket（/queue/join）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长任务超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源（图标）可长缓存
    location ~* ^/pwa/icons/.*\.(png|ico)$ {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
