      - orjson==3.10.15
      - jinja2==3.1.4
      - markupsafe==2.1.5
      - aiofiles==23.2.1
      - anyio==4.4.0
      - typer==0.20.1
      - tomlkit==0.12.0
      - semantic-version==2.10.0
